name: Build Trackr IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          python3 - <<'PY'
          import glob, os, pathlib, plistlib
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              with open(pathlib.Path(app) / 'Contents/Info.plist', 'rb') as f:
                  version = plistlib.load(f)['CFBundleShortVersionString']
              parts = tuple(int(x) for x in version.split('.') if x.isdigit())
              candidates.append((parts, app))
          if not candidates:
              raise SystemExit('No Xcode installation found')
          _, app = max(candidates)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'DEVELOPER_DIR={app}/Contents/Developer\n')
          print(f'Selected {app}')
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Generate project
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/prepare_build.py --sdk-version "$(xcrun --sdk iphoneos --show-sdk-version)"
          xcodegen generate --spec project-ci.yml

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Trackr.xcodeproj \
            -scheme Trackr \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages"

      - name: Select available iPhone simulator
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          inventory = json.load(sys.stdin)["devices"]
          devices = [d for runtime, items in inventory.items() if "iOS" in runtime for d in items if d.get("isAvailable") and "iPhone" in d["name"]]
          if not devices:
              raise SystemExit("No available iPhone simulator")
          print(devices[0]["udid"])
          ')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Test business rules and persistence
        run: |
          set -euo pipefail
          python3 scripts/run_xcodebuild.py --log-prefix build/ci-logs/test -- xcodebuild test \
            -project Trackr.xcodeproj \
            -scheme Trackr \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -jobs 2 \
            -derivedDataPath "$PWD/build/TestDerivedData" \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/TestResults.xcresult \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-"

      - name: Archive unsigned device application
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Trackr.xcodeproj \
            -scheme Trackr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Trackr.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -jobs 2 \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/Trackr.xcarchive/Products/Applications/Trackr.app"
          test -d "$APP"
          test -f "$APP/Trackr"
          test -f "$APP/PlugIns/TrackrWidgets.appex/TrackrWidgets"
          mkdir -p build/package/Payload
          ditto "$APP" build/package/Payload/Trackr.app
          cd build/package
          zip -qry ../Trackr.ipa Payload
          unzip -t ../Trackr.ipa

      - name: Upload Trackr.ipa
        uses: actions/upload-artifact@v7
        with:
          path: build/Trackr.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-TestResults
          path: |
            build/TestResults*.xcresult
            build/ci-logs/
          if-no-files-found: ignore
          retention-days: 7
