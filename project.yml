name: Trackr
options:
  bundleIdPrefix: com.mikhael
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
  minimumXcodeGenVersion: '2.45.1'
  developmentLanguage: pt-BR
settings:
  base:
    # Swift compiler 5.10+ uses language mode 5 (5.10 is not a valid -swift-version).
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '2.0.0'
    CURRENT_PROJECT_VERSION: '9'
    CODE_SIGNING_ALLOWED: NO
    TRACKR_APP_GROUP: group.com.mikhael.trackr
    CODE_SIGN_ENTITLEMENTS: Shared/Trackr.entitlements
targets:
  Trackr:
    type: application
    platform: iOS
    sources:
      - path: Shared
        excludes: [Trackr.entitlements]
      - path: Trackr
        excludes: [Info.plist, Settings.bundle]
      - path: Trackr/Settings.bundle
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikhael.trackr
        INFOPLIST_FILE: Trackr/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Trackr
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: Charts.framework
      - sdk: AppIntents.framework
      - sdk: UserNotifications.framework
      - sdk: WidgetKit.framework
      - sdk: PDFKit.framework
      - sdk: Vision.framework
      - sdk: LocalAuthentication.framework
      - target: TrackrWidgets
        embed: true
  TrackrWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
        excludes: [Trackr.entitlements]
      - path: TrackrWidgets
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikhael.trackr.Widgets
        INFOPLIST_FILE: TrackrWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TRACKR_WIDGET_EXTENSION"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
  TrackrTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mikhael.trackrTests
        CODE_SIGN_ENTITLEMENTS: ''
    dependencies:
      - target: Trackr
schemes:
  Trackr:
    build:
      targets:
        Trackr: all
        TrackrTests: [test]
    test:
      targets: [TrackrTests]
      gatherCoverageData: true
    archive:
      config: Release
