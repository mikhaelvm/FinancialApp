name: FinancialApp
options:
  bundleIdPrefix: com.mikhael
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
  minimumXcodeGenVersion: '2.45.1'
  developmentLanguage: pt-BR
settings:
  base:
    # Swift compiler 5.10+ uses language mode 5 (5.10 is not a valid -swift-version).
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.3.0'
    CURRENT_PROJECT_VERSION: '4'
    CODE_SIGNING_ALLOWED: NO
    LEDGER_APP_GROUP: group.com.mikhael.FinancialApp
    CODE_SIGN_ENTITLEMENTS: Shared/Ledger.entitlements
targets:
  FinancialApp:
    type: application
    platform: iOS
    sources:
      - path: Shared
        excludes: [Ledger.entitlements]
      - path: FinancialApp
        excludes: [Info.plist, Settings.bundle]
      - path: FinancialApp/Settings.bundle
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikhael.FinancialApp
        INFOPLIST_FILE: FinancialApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Ledger
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: Charts.framework
      - sdk: AppIntents.framework
      - sdk: UserNotifications.framework
      - sdk: WidgetKit.framework
      - sdk: PDFKit.framework
      - sdk: Vision.framework
      - target: LedgerWidgets
        embed: true
  LedgerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
        excludes: [Ledger.entitlements]
      - path: LedgerWidgets
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikhael.FinancialApp.Widgets
        INFOPLIST_FILE: LedgerWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LEDGER_WIDGET_EXTENSION"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
  FinancialAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mikhael.FinancialAppTests
        CODE_SIGN_ENTITLEMENTS: ''
    dependencies:
      - target: FinancialApp
schemes:
  FinancialApp:
    build:
      targets:
        FinancialApp: all
        FinancialAppTests: [test]
    test:
      targets: [FinancialAppTests]
      gatherCoverageData: true
    archive:
      config: Release
